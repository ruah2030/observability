# Dynamic configuration, hot-reloaded by Traefik's file provider.
# Reference a middleware from a container label as `<name>@file`.
http:
  middlewares:
    # Applied to every HTTPS request (entrypoint websecure).
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customFrameOptionsValue: SAMEORIGIN
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    # Basic auth for admin UIs. File generated by scripts/setup.sh.
    admin-auth:
      basicAuth:
        usersFile: /etc/traefik/secrets/htpasswd
        removeHeader: true

    compress:
      compress: {}

    # Opt-in per router: traefik.http.routers.<name>.middlewares=rate-limit@file
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
