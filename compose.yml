name: observability

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ═════════════════════════ Reverse proxy / TLS ═════════════════════════
  socket-proxy:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION}
    restart: unless-stopped
    privileged: true
    environment:
      CONTAINERS: 1   # list/inspect containers + read their logs
      NETWORKS: 1     # container network IPs (service discovery)
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0         # read-only: nothing can start, stop or exec
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket-proxy]
    logging: *logging

  traefik:
    image: traefik:${TRAEFIK_VERSION}
    restart: unless-stopped
    depends_on: [socket-proxy]
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=INFO
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.headers.names.User-Agent=keep
      - --api.dashboard=true
      - --ping=true
      - --ping.entrypoint=ping
      # entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.http.middlewares=secure-headers@file
      - --entrypoints.metrics.address=:8082
      - --entrypoints.ping.address=:8081
      # Let's Encrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # providers
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # observability
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.addserviceslabels=true
      - --tracing=true
      - --tracing.serviceName=traefik
      - --tracing.otlp=true
      - --tracing.otlp.http.endpoint=http://alloy:4318/v1/traces
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./secrets/htpasswd:/etc/traefik/secrets/htpasswd:ro
      - letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=ping", "--entrypoints.ping.address=:8081"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: admin-auth@file
    networks: [proxy, observability, socket-proxy]
    deploy:
      resources:
        limits: { memory: 256m }
    logging: *logging

  # ═════════════════════════════ Monitoring ═════════════════════════════
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    restart: unless-stopped
    depends_on: [socket-proxy]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE}
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --web.external-url=https://prometheus.${DOMAIN}
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.http.routers.prometheus.rule: Host(`prometheus.${DOMAIN}`)
      traefik.http.routers.prometheus.entrypoints: websecure
      traefik.http.routers.prometheus.middlewares: admin-auth@file
      traefik.http.services.prometheus.loadbalancer.server.port: "9090"
    networks: [proxy, observability, socket-proxy]
    deploy:
      resources:
        limits: { memory: 1g }
    logging: *logging

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://alertmanager.${DOMAIN}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/smtp_password:/etc/alertmanager/secrets/smtp_password:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.http.routers.alertmanager.rule: Host(`alertmanager.${DOMAIN}`)
      traefik.http.routers.alertmanager.entrypoints: websecure
      traefik.http.routers.alertmanager.middlewares: admin-auth@file
      traefik.http.services.alertmanager.loadbalancer.server.port: "9093"
    networks: [proxy, observability]
    deploy:
      resources:
        limits: { memory: 128m }
    logging: *logging

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 64m }
    logging: *logging

  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION}
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 256m }
    logging: *logging

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    restart: unless-stopped
    depends_on: [prometheus, loki, tempo]
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana.${DOMAIN}`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.middlewares: compress@file
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    networks: [proxy, observability]
    deploy:
      resources:
        limits: { memory: 512m }
    logging: *logging

  # ══════════════════════ Collection agent (logs + OTLP) ══════════════════════
  alloy:
    image: grafana/alloy:${ALLOY_VERSION}
    restart: unless-stopped
    depends_on: [socket-proxy, loki, tempo, prometheus]
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    networks: [observability, socket-proxy]
    deploy:
      resources:
        limits: { memory: 512m }
    logging: *logging

  # ══════════════════════════════ Logs ═══════════════════════════════
  volume-init:
    image: busybox:1.37
    user: root
    command: ["chown", "-R", "10001:10001", "/loki", "/var/tempo"]
    volumes:
      - loki_data:/loki
      - tempo_data:/var/tempo
    network_mode: none

  loki:
    image: grafana/loki:${LOKI_VERSION}
    restart: unless-stopped
    depends_on:
      volume-init: { condition: service_completed_successfully }
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION}
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 1g }
    logging: *logging

  # ═════════════════════════════ Tracing ═════════════════════════════
  tempo:
    image: grafana/tempo:${TEMPO_VERSION}
    restart: unless-stopped
    depends_on:
      volume-init: { condition: service_completed_successfully }
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yml", "-config.expand-env=true"]
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION}
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 1g }
    logging: *logging

networks:
  # Public-facing: Traefik + every service it routes to.
  proxy:
    name: proxy
  # Telemetry: apps join it to send OTLP to Alloy and be scraped by Prometheus.
  observability:
    name: observability
  # Docker API access, isolated from everything else.
  socket-proxy:
    name: socket-proxy
    internal: true

volumes:
  letsencrypt:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  alloy_data:
  loki_data:
  tempo_data:
