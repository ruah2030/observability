# Example: plugging an application into the observability stack.
# Everything below is the full integration — no agent, no sidecar.
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      # ── Tracing + metrics: push OTLP to Alloy ──
      OTEL_SERVICE_NAME: api                       # same as the compose service name
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.version=1.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none                     # logs already go through stdout
      OTEL_NODE_DISABLED_INSTRUMENTATIONS: fs,dns,net
    labels:
      # ── Reverse proxy / TLS ──
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`api.example.com`)
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.middlewares: compress@file,rate-limit@file
      traefik.http.services.api.loadbalancer.server.port: "3000"
      traefik.http.services.api.loadbalancer.healthcheck.path: /health
      # ── Optional: Prometheus scrape if the app exposes /metrics ──
      # prometheus.scrape: "true"
      # prometheus.port: "3000"
      # prometheus.path: /metrics
    networks: [proxy, observability]

networks:
  proxy:
    external: true
  observability:
    external: true
