groups:
  - name: host
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "node-exporter unreachable on {{ $labels.instance }}"
          description: "No host metrics for 2 minutes."

      - alert: HostHighCpuLoad
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "CPU above 85% on {{ $labels.instance }}"
          description: "Current value: {{ $value | humanizePercentage }}."

      - alert: HostOutOfMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Less than 10% memory available on {{ $labels.instance }}"
          description: "Available: {{ $value | humanizePercentage }}."

      - alert: HostDiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.10
          and node_filesystem_readonly == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} below 10% free on {{ $labels.instance }}"
          description: "Free: {{ $value | humanizePercentage }}."

      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
          and node_filesystem_readonly == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} will be full within 24h on {{ $labels.instance }}"
          description: "Linear prediction over the last 6 hours."
